[project]
name = "auratrack"
version = "1.0.0"
description = "AuraTrack - Retail Intelligence API and Computer Vision Pipeline"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pandas",
    "requests",
    "opencv-python",
    "ultralytics",
    "shapely",
    "rich",
    "torch",
    "torchvision"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["app", "pipeline"]
